<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" fill="none" role="img" aria-label="Edulab58">
<!--
  Logoul Edulab58 — FRATE cu cel al lui edumat58, nu variație.

  edumat58: carte deschisă în line-art, cu un panou rotunjit în patru celule
  deasupra, conținând + Σ √ π. O singură culoare cărămizie, trasă gros, fără
  umplere și fără degrade.

  Aici: aceeași carte, același panou, aceeași grosime — se schimbă doar cele
  patru semne, care devin de fizică, și culoarea, care devine indigo-violet.

  Cele patru semne oglindesc CATEGORIILE celor de la matematică, nu formele:
    +  operator      -> vector (mărimea vectorială, cu săgeata ei)
    Σ  literă greacă -> λ, lungimea de undă
    √  semn desenat  -> sinusoida, oscilația
    π  constantă     -> Ω, unitatea de rezistență
-->
<g stroke="#4a2fa8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">

  <!-- panoul rotunjit, cu cele două linii de despărțire -->
  <path d="M56 34c0-9 7-16 16-16h76c9 0 16 7 16 16v106H56V34z"/>
  <path d="M110 18v122"/>
  <path d="M56 79h108"/>

  <!-- stânga-sus: vector -->
  <path d="M74 62h22"/>
  <path d="M90 56l7 6-7 6"/>
  <path d="M74 46v22" stroke-width="5.5"/>

  <!-- dreapta-sus: lambda -->
  <path d="M128 66l11-24 12 24"/>
  <path d="M136 50l-9 16"/>

  <!-- stânga-jos: sinusoida -->
  <path d="M72 110c5-13 11-13 16 0s11 13 16 0" fill="none"/>

  <!-- dreapta-jos: omega -->
  <path d="M127 122c-6-6-6-18 3-24 7-5 16-3 20 4 4 7 1 15-4 20"/>
  <path d="M124 122h9M141 122h9"/>

  <!-- cartea deschisă -->
  <path d="M110 158c-14-11-32-14-52-11v37c20-3 38 0 52 11 14-11 32-14 52-11v-37c-20-3-38 0-52 11z"/>
  <path d="M110 158v37"/>
</g>
</svg>
